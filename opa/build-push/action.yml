name: 'OPA Build and Push'
description: |
  Builds an OPA bundle (`bundle.tar.gz`) from a Rego directory and pushes it to
  an OCI registry. The bundle is always tagged with `sha256-<content-hash>`,
  where `<content-hash>` is `sha256sum bundle.tar.gz`. `additional-tags`
  appends to that. Test files (`*_test.rego`) are excluded so the production
  bundle stays lean.

  When a bundle with the same content sha already exists in the registry, the
  action skips the push and applies `additional-tags` to the existing manifest
  via `oras tag`. This avoids creating duplicate manifests / signatures /
  provenance attestations for identical content.

  Note: this optimization only fires when `opa build` produces byte-identical
  output across runs.

  The action will install OPA and ORAS automatically if they aren't already on
  PATH.

  The runner must already be authenticated to the target registry (use
  `docker/login-action`); the action does not handle credentials.

inputs:
  path:
    description: |
      Path to the Rego directory to bundle. Resolves relative to the workspace.
    required: true
  push:
    description: |
      If `'true'` (default), pushes the built bundle to the registry. Set to
      `'false'` to build only — useful for PR validation where the push happens
      on merge.
    required: false
    default: 'true'
  artifact-name:
    description: |
      Full OCI reference (without tag) the bundle will be pushed to. Example:
      `ghcr.io/kartverket/accesserator/opa-bundle`. Required when `push` is `'true'`.
    required: false
    default: ''
  additional-tags:
    description: |
      Comma-separated list of extra tags to apply on top of the always-included
      `sha256-<content-hash>` tag (e.g. `latest,v1`). Whitespace around each
      tag is stripped. Ignored when `push` is `'false'`.
    required: false
    default: ''

outputs:
  bundle-path:
    description: 'Path to the local bundle file (always `bundle.tar.gz`).'
    value: 'bundle.tar.gz'
  digest:
    description: 'Manifest digest of the pushed bundle (e.g. `sha256:...`).'
    value: ${{ steps.push.outputs.digest }}
  tags:
    description: 'Comma-joined list of tags applied to the pushed bundle.'
    value: ${{ steps.push.outputs.tags }}
  image-ref:
    description: |
      Fully qualified `<artifact-name>@<digest>` reference. Use this for
      cosign signing or provenance attestation.
    value: ${{ steps.push.outputs.image-ref }}

runs:
  using: composite
  steps:
    - name: Check OPA installation
      id: check-opa
      shell: bash
      run: |
        if command -v opa >/dev/null 2>&1; then
          echo "OPA already installed: $(opa version 2>/dev/null | head -1 || true)"
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup OPA
      if: steps.check-opa.outputs.installed != 'true'
      uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
      with:
        version: '1.16.2'

    - name: Check ORAS installation
      id: check-oras
      shell: bash
      run: |
        if command -v oras >/dev/null 2>&1; then
          echo "ORAS already installed: $(oras version 2>/dev/null | head -1 || true)"
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup ORAS
      if: steps.check-oras.outputs.installed != 'true'
      uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

    - id: build
      name: Build OPA bundle
      shell: bash
      env:
        REGO_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail

        if [[ ! -e "$REGO_PATH" ]]; then
          echo "::error::path does not exist: $REGO_PATH"
          exit 1
        fi

        opa build -b "$REGO_PATH" --ignore '*_test.rego' -o bundle.tar.gz
        tar -tzf bundle.tar.gz
        echo "bundle-path=bundle.tar.gz" >> "$GITHUB_OUTPUT"

    - id: push
      name: Push bundle to registry
      if: inputs.push == 'true'
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ADDITIONAL_TAGS: ${{ inputs.additional-tags }}
      run: |
        set -euo pipefail

        if [[ -z "$ARTIFACT_NAME" ]]; then
          echo "::error::artifact-name is required when push is 'true'"
          exit 1
        fi

        # Derive the always-on tag from the bundle's actual content hash so
        # the same bytes always map to the same tag — letting us short-circuit
        # the push when the content already exists in the registry.
        content_sha=$(sha256sum bundle.tar.gz | cut -d' ' -f1)
        SHA_TAG="sha256-${content_sha}"

        # Build the full tag list. The content-derived sha tag is always first;
        # caller's comma-separated extras follow. Whitespace around each entry
        # is stripped so callers can pass `"latest, v1, stable"` without
        # surprises.
        all_tags=("$SHA_TAG")
        IFS=',' read -ra EXTRA_TAGS <<< "$ADDITIONAL_TAGS"
        for t in "${EXTRA_TAGS[@]}"; do
          t="${t//[[:space:]]/}"
          [[ -z "$t" ]] && continue
          all_tags+=("$t")
        done

        # If a bundle with this exact content already exists in the registry,
        # `oras tag` is cheaper and avoids creating duplicate manifests /
        # signatures / provenance attestations. We just apply the caller's
        # extras to the existing manifest.
        if oras manifest fetch "${ARTIFACT_NAME}:${SHA_TAG}" >/dev/null 2>&1; then
          echo "Bundle already exists at ${ARTIFACT_NAME}:${SHA_TAG} — applying tags only."
          digest=$(oras manifest fetch --descriptor "${ARTIFACT_NAME}:${SHA_TAG}" | jq -r '.digest')
          for t in "${all_tags[@]}"; do
            # Skip the sha-tag itself; it's already present.
            [[ "$t" == "$SHA_TAG" ]] && continue
            oras tag "${ARTIFACT_NAME}:${SHA_TAG}" "$t"
          done
        else
          # First push for this content — apply every tag in a single ORAS
          # call. ORAS accepts a comma-joined tag list inside the ref
          # (`...:tag1,tag2`) and applies all of them to the same manifest.
          tag_list=$(IFS=','; echo "${all_tags[*]}")
          digest=$(oras push "${ARTIFACT_NAME}:${tag_list}" \
            --artifact-type "application/vnd.cncf.openpolicyagent.config.v1+json" \
            --config /dev/null:application/vnd.oci.image.config.v1+json \
            bundle.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip \
            --format json | jq -r '.digest')
        fi

        # Comma-joined list of all tags now pointing at this digest.
        tag_list=$(IFS=','; echo "${all_tags[*]}")

        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "tags=$tag_list" >> "$GITHUB_OUTPUT"
        echo "image-ref=${ARTIFACT_NAME}@${digest}" >> "$GITHUB_OUTPUT"

    - name: Write step summary
      if: always()
      shell: bash
      env:
        BUNDLE_PATH: bundle.tar.gz
        PUSH: ${{ inputs.push }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        DIGEST: ${{ steps.push.outputs.digest }}
        TAGS: ${{ steps.push.outputs.tags }}
        IMAGE_REF: ${{ steps.push.outputs.image-ref }}
      run: |
        {
          echo "## OPA bundle"
          echo ""
          if [[ ! -f "$BUNDLE_PATH" ]]; then
            # Build step failed before producing the tarball.
            echo "_Bundle was not built._"
          else
            if [[ "$PUSH" == "true" && -n "$DIGEST" ]]; then
              echo "**Image:** \`${IMAGE_REF}\`"
              echo ""
              echo "**Tags:**"
              IFS=',' read -ra TAG_ARR <<< "$TAGS"
              for t in "${TAG_ARR[@]}"; do
                echo "- \`${ARTIFACT_NAME}:${t}\`"
              done
              echo ""
            else
              # Built but not pushed: either push=false or the push step failed.
              echo "_Bundle was built (\`${BUNDLE_PATH}\`) but not pushed._"
              echo ""
            fi

            echo "**Bundle contents:**"
            echo ""
            echo '```'
            tar -tzf "$BUNDLE_PATH"
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
